<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — OwnerDesk Restaurant Chain Management</title>
  
  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-body);
      padding: 2rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-md);
      padding: 2.25rem;
    }
  </style>
</head>
<body class="page-fade-in">

  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Brand Logo -->
      <div class="text-center mb-4">
        <a href="/index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
          <div class="brand-icon">
            <i class="bi bi-shop-window"></i>
          </div>
          <span class="brand-text">OwnerDesk</span>
        </a>
        <h4 class="fw-bold text-dark mt-3 mb-1">Sign in to your console</h4>
        <p class="text-muted small">Manage every restaurant outlet from one desk</p>
      </div>

      <!-- Alert Box -->
      <div id="loginAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label for="loginEmail" class="form-label small fw-semibold text-dark">Email Address or Manager ID</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person-badge"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="loginEmail" placeholder="e.g. owner@restaurant.in or MGR-1" required autocomplete="username">
          </div>
        </div>

        <div class="mb-4">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <label for="loginPassword" class="form-label small fw-semibold text-dark mb-0">Password</label>
          </div>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
            <input type="password" class="form-control border-start-0 ps-0" id="loginPassword" placeholder="••••••••" required autocomplete="current-password">
          </div>
        </div>

        <button type="submit" id="loginSubmitBtn" class="btn btn-primary w-100 py-2 mb-2">
          Sign In to Dashboard
        </button>

        <button type="button" id="quickDemoBtn" class="btn btn-outline-secondary w-100 py-2">
          <i class="bi bi-lightning-charge me-1"></i> Quick Demo Login (Admin / Owner)
        </button>
      </form>

      <!-- Footer Links -->
      <div class="mt-4 pt-2 border-top text-center small text-muted">
        Don't have an owner account? 
        <a href="/register.html" class="text-primary text-decoration-none fw-semibold">Register here</a>
      </div>
    </div>
  </div>

  <!-- Supabase CDN & App Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Redirect if already logged in
      const isAlreadyLoggedIn = await Auth.redirectIfAuthenticated();
      if (isAlreadyLoggedIn) return;

      const form = document.getElementById('loginForm');
      const alertBox = document.getElementById('loginAlert');
      const submitBtn = document.getElementById('loginSubmitBtn');
      const quickDemoBtn = document.getElementById('quickDemoBtn');

      const urlParams = new URLSearchParams(window.location.search);
      const urlError = urlParams.get('error');
      if (urlError) {
        alertBox.textContent = urlError;
        alertBox.classList.remove('d-none');
      }

      if (quickDemoBtn) {
        quickDemoBtn.addEventListener('click', () => {
          document.getElementById('loginEmail').value = 'owner@ownerdesk.in';
          document.getElementById('loginPassword').value = '123456';
          form.dispatchEvent(new Event('submit'));
        });
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');

        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;

        if (!email || !password) {
          alertBox.textContent = 'Please enter both your email and password.';
          alertBox.classList.remove('d-none');
          return;
        }

        UI.setButtonLoading(submitBtn, true, '', 'Signing in...');

        try {
          await Auth.signIn(email, password);
          const params = new URLSearchParams(window.location.search);
          const redirectUrl = params.get('redirect') || '/dashboard.html';
          window.location.href = redirectUrl;
        } catch (err) {
          alertBox.textContent = err.message || 'Login failed. Please check your credentials.';
          alertBox.classList.remove('d-none');
          UI.setButtonLoading(submitBtn, false);
        }
      });
    });
  </script>
</body>
</html>
