<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Owner Account — OwnerDesk</title>
  
  <!-- Bootstrap 5 & Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <!-- Custom CSS -->
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/dashboard.css">
  
  <style>
    .auth-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-body);
      padding: 2.5rem 1rem;
    }
    .auth-card {
      width: 100%;
      max-width: 460px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-md);
      padding: 2.25rem;
    }
  </style>
</head>
<body class="page-fade-in">

  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Brand Logo -->
      <div class="text-center mb-4">
        <a href="/index.html" class="d-inline-flex align-items-center gap-2 text-decoration-none">
          <div class="brand-icon">
            <i class="bi bi-shop-window"></i>
          </div>
          <span class="brand-text">OwnerDesk</span>
        </a>
        <h4 class="fw-bold text-dark mt-3 mb-1">Create your Owner account</h4>
        <p class="text-muted small">Centralize your restaurant outlets in one console</p>
      </div>

      <!-- Alert Box -->
      <div id="registerAlert" class="alert alert-danger py-2 px-3 small d-none" role="alert"></div>

      <!-- Register Form -->
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label for="regFullName" class="form-label small fw-semibold text-dark">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-person"></i></span>
            <input type="text" class="form-control border-start-0 ps-0" id="regFullName" placeholder="e.g. Rahul Sharma" required autocomplete="name">
          </div>
        </div>

        <div class="mb-3">
          <label for="regEmail" class="form-label small fw-semibold text-dark">Business Email</label>
          <div class="input-group">
            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
            <input type="email" class="form-control border-start-0 ps-0" id="regEmail" placeholder="rahul@restaurant.in" required autocomplete="email">
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-sm-6">
            <label for="regPassword" class="form-label small fw-semibold text-dark">Password</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" id="regPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>
            <div class="text-muted small" style="font-size: 0.72rem;">Min 6 characters</div>
          </div>
          <div class="col-sm-6">
            <label for="regConfirmPassword" class="form-label small fw-semibold text-dark">Confirm</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-check2-circle"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" id="regConfirmPassword" placeholder="••••••••" required minlength="6" autocomplete="new-password">
            </div>
          </div>
        </div>

        <div class="mb-3">
          <div class="p-2 border rounded bg-light small text-muted d-flex align-items-center gap-2">
            <i class="bi bi-shield-lock-fill text-primary"></i>
            <span>Account assigned role: <strong>Restaurant Chain Owner</strong></span>
          </div>
        </div>

        <button type="submit" id="registerSubmitBtn" class="btn btn-primary w-100 py-2">
          Create Account & Launch Console
        </button>
      </form>

      <!-- Footer Links -->
      <div class="mt-4 pt-2 border-top text-center small text-muted">
        Already have an account? 
        <a href="/login.html" class="text-primary text-decoration-none fw-semibold">Sign in here</a>
      </div>
    </div>
  </div>

  <!-- Supabase CDN & App Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Redirect if already logged in
      const isAlreadyLoggedIn = await Auth.redirectIfAuthenticated();
      if (isAlreadyLoggedIn) return;

      const form = document.getElementById('registerForm');
      const alertBox = document.getElementById('registerAlert');
      const submitBtn = document.getElementById('registerSubmitBtn');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        alertBox.classList.add('d-none');

        const fullName = document.getElementById('regFullName').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const password = document.getElementById('regPassword').value;
        const confirmPassword = document.getElementById('regConfirmPassword').value;

        if (!fullName || !email || !password) {
          alertBox.textContent = 'Please fill in all required fields.';
          alertBox.classList.remove('d-none');
          return;
        }

        if (password !== confirmPassword) {
          alertBox.textContent = 'Passwords do not match.';
          alertBox.classList.remove('d-none');
          return;
        }

        if (password.length < 6) {
          alertBox.textContent = 'Password must be at least 6 characters.';
          alertBox.classList.remove('d-none');
          return;
        }

        UI.setButtonLoading(submitBtn, true, '', 'Setting up account...');

        try {
          await Auth.signUp(fullName, email, password, confirmPassword);
          UI.showToast('Account created successfully! Welcome to OwnerDesk.', 'success');
          setTimeout(() => {
            window.location.href = '/dashboard.html';
          }, 800);
        } catch (err) {
          alertBox.textContent = err.message || 'Registration failed. Please check inputs.';
          alertBox.classList.remove('d-none');
          UI.setButtonLoading(submitBtn, false);
        }
      });
    });
  </script>
</body>
</html>
